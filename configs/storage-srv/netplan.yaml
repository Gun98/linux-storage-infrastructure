# WEB-SRV network configuration
# ens33 : Service / iSCSI Path 1
# ens37 : iSCSI Path 2

network:
  version: 2
  ethernets:
    ens33:
      dhcp4: false
      addresses:
        - 192.168.31.20/24
      routes:
        - to: default
          via: 192.168.31.2
      nameservers:
        addresses:
          - 192.168.31.2
          - 8.8.8.8

    ens37:
      dhcp4: false
      addresses:
        - 192.168.50.20/24
